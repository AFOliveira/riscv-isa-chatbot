# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: clmul
long_name: Carry-less multiply (low-part)
description: |
  `clmul` produces the lower half of the 2*XLEN carry-less product
definedBy:
  anyOf:
  - Zbc
  - Zbkc
assembly: xd, xs1, xs2
format:
  opcodes:
    $child_of: inst_type/R.yaml#/opcodes
    funct7:
      location: 31-25
      display_name: CLMUL
      value: 0b0000101
    funct3:
      location: 14-12
      display_name: CLMUL
      value: 0b001
    opcode:
      location: 6-0
      $child_of: inst_opcode/OP.yaml#/data
      display_name: OP
      value: 0b0110011
  $child_of:
  - inst_subtype/R/R-x.yaml#/data
  type: {"$ref": "inst_type/R.yaml#"}
  subtype: {"$ref": "inst_subtype/R/R-x.yaml#"}
  variables:
    xs2:
      $child_of: inst_var/xs2.yaml#/data
      type: {"$ref": "inst_var_type/x_src_reg.yaml#"}
      location: 24-20
    xs1:
      $child_of: inst_var/xs1.yaml#/data
      type: {"$ref": "inst_var_type/x_src_reg.yaml#"}
      location: 19-15
    xd:
      $child_of: inst_var/xd.yaml#/data
      type: {"$ref": "inst_var_type/x_dst_reg.yaml#"}
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  if (implemented?(ExtensionName::B) && (CSR[misa].B == 1'b0)) {
    raise (ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  XReg xs1_val = X[xs1];
  XReg xs2_val = X[xs2];
  XReg output = 0;

  for (U32 i=0; i < xlen(); i++) {
    output = (((xs2_val >> i) & 1) == 1)
      ? output ^ (xs1_val << i)
      : output;
  }

  X[xd] = output;

# SPDX-SnippetBegin
# SPDX-FileCopyrightText: 2017-2025 Contributors to the RISCV Sail Model <https://github.com/riscv/sail-riscv/blob/master/LICENCE>
# SPDX-License-Identifier: BSD-2-Clause
sail(): |
  {
    let rs1_val = X(rs1);
    let rs2_val = X(rs2);
    result : xlenbits = zeros();
    foreach (i from 0 to (xlen_val - 1))
      if rs2_val[i] == bitone then result = result ^ (rs1_val << i);
    X(rd) = result;
    RETIRE_SUCCESS
  }

# SPDX-SnippetEnd
