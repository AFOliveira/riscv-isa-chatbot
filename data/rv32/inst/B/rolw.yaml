# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: rolw
long_name: Rotate left word (Register)
description: |
  Performs a rotate left of the least-significant word of xs1 by the amount in least-significant 5 bits of xs2.
  The resulting word value is sign-extended by copying bit 31 to all of the more-significant bits.
definedBy:
  anyOf:
  - Zbb
  - Zbkb
assembly: xd, xs1, xs2
base: 64
format:
  opcodes:
    $child_of: inst_type/R.yaml#/opcodes
    funct7:
      location: 31-25
      display_name: ROLW
      value: 0b0110000
    funct3:
      location: 14-12
      display_name: ROLW
      value: 0b001
    opcode:
      location: 6-0
      $child_of: inst_opcode/OP-32.yaml#/data
      display_name: OP-32
      value: 0b0111011
  $child_of:
  - inst_subtype/R/R-x.yaml#/data
  type: {"$ref": "inst_type/R.yaml#"}
  subtype: {"$ref": "inst_subtype/R/R-x.yaml#"}
  variables:
    xs2:
      $child_of: inst_var/xs2.yaml#/data
      type: {"$ref": "inst_var_type/x_src_reg.yaml#"}
      location: 24-20
    xs1:
      $child_of: inst_var/xs1.yaml#/data
      type: {"$ref": "inst_var_type/x_src_reg.yaml#"}
      location: 19-15
    xd:
      $child_of: inst_var/xd.yaml#/data
      type: {"$ref": "inst_var_type/x_dst_reg.yaml#"}
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  if (implemented?(ExtensionName::B) && (CSR[misa].B == 1'b0)) {
    raise (ExceptionCode::IllegalInstruction, mode(), $encoding);
  }

  XReg xs1_word = X[xs1][31:0];
  XReg shamt = X[xs2][4:0];

  XReg unextended_result = (xs1_word << shamt) | (xs1_word >> (32 - shamt));

  X[xd] = {{32{unextended_result[31]}}, unextended_result};

# SPDX-SnippetBegin
# SPDX-FileCopyrightText: 2017-2025 Contributors to the RISCV Sail Model <https://github.com/riscv/sail-riscv/blob/master/LICENCE>
# SPDX-License-Identifier: BSD-2-Clause
sail(): |
  {
    let rs1_val = (X(rs1))[31..0];
    let shamt = (X(rs2))[4..0];
    let result : bits(32) = match op {
      RISCV_ROLW => rs1_val <<< shamt,
      RISCV_RORW => rs1_val >>> shamt
    };
    X(rd) = sign_extend(result);
    RETIRE_SUCCESS
  }

# SPDX-SnippetEnd
